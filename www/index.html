<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Scènes Paris</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #16161a;
    --card2: #1e1e24;
    --border: #2a2a35;
    --text: #f0eff4;
    --text2: #9a99a8;
    --accent: #e8c96b;
    --cat1: #e8c96b;
    --cat2: #5b9cf6;
    --cat3: #f05a7e;
    --cat4: #a78bfa;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html {
    height: 100%;
    background: var(--card);
  }

  body {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    background: var(--card);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    background: var(--card);
    padding: calc(var(--safe-top) + 14px) 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #app-title { font-size: 22px; font-weight: 700; color: var(--text); }
  #app-title span { color: var(--accent); }

  #lang-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 20px;
    cursor: pointer;
  }

  #search-wrap { position: relative; margin-bottom: 10px; }
  #search-input {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 36px 9px 14px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: inherit;
    -webkit-appearance: none;
  }
  #search-input::placeholder { color: var(--text2); }
  #search-clear {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text2); font-size: 18px;
    cursor: pointer; display: none; line-height: 1;
  }

  #filters {
    display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none;
  }
  #filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0;
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px; color: var(--text2);
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .filter-btn.active { color: var(--bg); font-weight: 700; }
  .filter-btn[data-cat="all"].active { background: var(--accent); border-color: var(--accent); }
  .filter-btn[data-cat="1"].active   { background: var(--cat1);   border-color: var(--cat1); }
  .filter-btn[data-cat="2"].active   { background: var(--cat2);   border-color: var(--cat2); }
  .filter-btn[data-cat="3"].active   { background: var(--cat3);   border-color: var(--cat3); }
  .filter-btn[data-cat="4"].active   { background: var(--cat4);   border-color: var(--cat4); }

  /* ── LISTE ── */
  #list-container {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(var(--safe-bottom) + 20px);
  }

  #count-bar { font-size: 12px; color: var(--text2); padding: 0 4px 8px; }

  .cat-section { margin-bottom: 20px; }
  .cat-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
    padding: 4px 4px 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-title .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .salle-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 15px; margin-bottom: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
  }
  .salle-card:active { background: var(--card2); }

  .salle-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    background-size: cover; background-position: center;
    overflow: hidden;
  }
  .salle-icon.has-photo { font-size: 0; }
  .salle-info { flex: 1; min-width: 0; }
  .salle-name {
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .salle-sub {
    font-size: 12px; color: var(--text2); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .salle-capa { font-size: 12px; font-weight: 700; color: var(--text2); flex-shrink: 0; }

  #empty-state { display: none; text-align: center; padding: 60px 20px; color: var(--text2); font-size: 15px; }
  #empty-state.visible { display: block; }

  /* ── MODAL DÉTAIL ── */
  #modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: calc(-1 * var(--safe-bottom));
    background: rgba(0,0,0,0.7);
    z-index: 500; display: none; align-items: flex-end;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--card);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    width: 100%; max-height: 80vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--safe-bottom) + 20px);
  }
  #modal-handle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 0 10px;
    cursor: pointer;
  }
  #modal-handle::after {
    content: '';
    width: 38px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    display: block;
  }
  #modal-header {
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 14px;
  }
  #modal-icon {
    width: 52px; height: 52px; border-radius: 12px;
    font-size: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #modal-name { font-size: 19px; font-weight: 700; line-height: 1.2; }
  #modal-arr  { font-size: 13px; color: var(--text2); margin-top: 3px; }
  #modal-body { padding: 0 20px; }
  .modal-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row-label { color: var(--text2); width: 90px; flex-shrink: 0; font-size: 13px; padding-top: 1px; }
  .modal-row-value { flex: 1; line-height: 1.4; }
  .capa-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 700; color: #0d0d0f;
  }
  .cat-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }
  #modal-photo {
    width: 100%; height: 180px; object-fit: cover;
    display: none; background: var(--card2);
  }
  #modal-photo.loaded { display: block; }
  #modal-photo-placeholder {
    width: 100%; height: 100px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; background: var(--card2);
  }

  #modal-btn-site {
    display: block; margin: 14px 20px 8px;
    border: none; border-radius: 12px; padding: 13px;
    text-align: center; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; text-decoration: none; color: #0d0d0f;
  }
  #modal-btn-plans {
    display: block; margin: 0 20px;
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 13px;
    text-align: center; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; text-decoration: none;
  }

  /* ── MODAL NOS APPS ── */
  #modal-apps-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    z-index: 600; display: none; align-items: flex-end;
  }
  #modal-apps-overlay.open { display: flex; }
  #modal-apps {
    background: var(--card);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    width: 100%;
    height: 88vh;
    display: flex; flex-direction: column;
    padding-bottom: calc(var(--safe-bottom) + 0px);
  }
  #modal-apps-header {
    flex-shrink: 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  #modal-apps-handle {
    width: 38px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 12px auto 8px;
  }
  #modal-apps h2 {
    text-align: center; font-size: 16px; font-weight: 700;
    padding: 0 20px 4px;
  }
  #modal-apps-scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--safe-bottom) + 20px);
  }
  .apps-cat-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--accent);
    padding: 12px 20px 4px;
  }
  .app-row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .app-row:active { background: var(--card2); }
  .app-row:last-child { border-bottom: none; }
  .app-row-icon {
    width: 50px; height: 50px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0; border: 1px solid var(--border);
    overflow: hidden; background: var(--card2);
  }
  .app-row-icon img { width: 50px; height: 50px; border-radius: 11px; display: block; }
  .app-row-info { flex: 1; }
  .app-row-name { font-size: 14px; font-weight: 700; }
  .app-row-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .app-row-badge {
    flex-shrink: 0;
    background: var(--accent); color: #0d0d0f;
    font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 20px;
    white-space: nowrap;
  }

  .app-row-badge {
    flex-shrink: 0;
  }
  .app-store-badge {
    display: block;
    background: #000; color: #fff;
    border-radius: 7px;
    padding: 4px 8px;
    text-align: center;
    line-height: 1;
  }
  .app-store-badge .badge-sub { font-size: 8px; letter-spacing: 0.3px; opacity: 0.85; }
  .app-store-badge .badge-main { font-size: 13px; font-weight: 700; letter-spacing: -0.3px; }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    flex-shrink: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: var(--safe-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; cursor: pointer;
    color: var(--text2); font-family: inherit; padding: 10px 0; font-size: 10px;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
</style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div id="app-title">Scènes <span>Paris</span></div>
    <button id="lang-btn" onclick="toggleLang()">🇬🇧</button>
  </div>
  <div id="search-wrap">
    <input type="search" id="search-input" placeholder="Rechercher une salle…"
           oninput="onSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="filters">
    <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">Toutes</button>
    <button class="filter-btn" data-cat="1" onclick="setFilter('1')">🥇 Arenas</button>
    <button class="filter-btn" data-cat="2" onclick="setFilter('2')">🎶 Grandes</button>
    <button class="filter-btn" data-cat="3" onclick="setFilter('3')">🎤 Mythiques</button>
    <button class="filter-btn" data-cat="4" onclick="setFilter('4')">🎭 Classiques</button>
  </div>
</div>

<div id="list-container">
  <div id="count-bar"></div>
  <div id="salle-list"></div>
  <div id="empty-state">Aucune salle trouvée</div>
</div>

<div id="bottom-nav">
  <button class="nav-btn active">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span id="nav-label-list">Liste</span>
  </button>
  <button class="nav-btn" onclick="openAppsModal()">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-5 1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
    <span id="nav-label-apps">Nos apps</span>
  </button>
</div>

<!-- MODAL DÉTAIL -->
<div id="modal-overlay" onclick="maybeCloseModal(event)">
  <div id="modal">
    <div id="modal-handle" onclick="closeModalHandle()"></div>
    <div id="modal-photo-placeholder"></div>
    <img id="modal-photo" alt=""/>
    <div id="modal-header">
      <div id="modal-icon"></div>
      <div><div id="modal-name"></div><div id="modal-arr"></div></div>
    </div>
    <div id="modal-body"></div>
    <a id="modal-btn-site" href="#" target="_blank"></a>
    <a id="modal-btn-plans" href="#" target="_blank"></a>
  </div>
</div>

<!-- MODAL NOS APPS -->
<div id="modal-apps-overlay" onclick="maybeCloseApps(event)">
  <div id="modal-apps">
    <div id="modal-apps-header">
      <div id="modal-apps-handle" onclick="document.getElementById('modal-apps-overlay').classList.remove('open')"></div>
      <h2 id="apps-title">Nos autres apps</h2>
    </div>
    <div id="modal-apps-scroll">
      <div id="apps-list"></div>
      <div style="text-align:center;padding:16px 20px 4px;font-size:11px;color:var(--text2);line-height:1.6;">© Michel Garlandat 2026<br>Fait avec Anthropic Claude · Version 1.0</div>
    </div>
  </div>
</div>

const thumbCache = {};

async function loadPhoto(s) {
  const imgEl = document.getElementById('modal-photo');
  const placeholder = document.getElementById('modal-photo-placeholder');
  imgEl.classList.remove('loaded');
  placeholder.textContent = s.icon;
  placeholder.style.display = 'flex';

  if (!s.wt) return;

  if (thumbCache[s.id]) {
    imgEl.src = thumbCache[s.id];
    imgEl.classList.add('loaded');
    placeholder.style.display = 'none';
    return;
  }

  try {
    const r = await Capacitor.Plugins.CapacitorHttp.get({
      url: s.wt, responseType: 'arraybuffer'
    });
    const mime = s.wt.endsWith('.png') ? 'image/png' : 'image/jpeg';
    const b64 = 'data:' + mime + ';base64,' + r.data;
    thumbCache[s.id] = b64;
    imgEl.src = b64;
    imgEl.classList.add('loaded');
    placeholder.style.display = 'none';
  } catch(e) {
    console.log('photo error id:' + s.id, e);
  }
}

async function loadThumb(s) {
  if (thumbCache[s.id] || !s.wt) return;
  try {
    const r = await Capacitor.Plugins.CapacitorHttp.get({
      url: s.wt, responseType: 'arraybuffer'
    });
    const mime = s.wt.endsWith('.png') ? 'image/png' : 'image/jpeg';
    thumbCache[s.id] = 'data:' + mime + ';base64,' + r.data;
    // Mettre à jour la vignette dans la liste si visible
    const iconEl = document.getElementById('icon-' + s.id);
    if (iconEl) {
      iconEl.style.backgroundImage = `url('${thumbCache[s.id]}')`;
      iconEl.style.backgroundSize = 'cover';
      iconEl.style.backgroundPosition = 'center';
      iconEl.classList.add('has-photo');
    }
  } catch(e) {}
}

let lang   = localStorage.getItem('sp_lang') || 'fr';
let filter = 'all';
let query  = '';
let activeSalle = null;

document.addEventListener('DOMContentLoaded', () => { applyLang(); render(); });

function toggleLang() {
  lang = lang === 'fr' ? 'en' : 'fr';
  localStorage.setItem('sp_lang', lang);
  applyLang(); render();
  if (activeSalle !== null) openModal(activeSalle);
}

function applyLang() {
  document.getElementById('lang-btn').textContent = lang === 'fr' ? '🇬🇧' : '🇫🇷';
  document.getElementById('search-input').placeholder = lang === 'fr' ? 'Rechercher une salle…' : 'Search a venue…';
  document.getElementById('nav-label-list').textContent = lang === 'fr' ? 'Liste' : 'List';
  document.getElementById('nav-label-apps').textContent = lang === 'fr' ? 'Nos apps' : 'Our apps';
  document.getElementById('apps-title').textContent = lang === 'fr' ? 'Nos autres apps' : 'Our other apps';
  const labels = {
    all:{ fr:'Toutes', en:'All' }, 1:{ fr:'🥇 Arenas', en:'🥇 Arenas' },
    2:{ fr:'🎶 Grandes', en:'🎶 Large' }, 3:{ fr:'🎤 Mythiques', en:'🎤 Iconic' },
    4:{ fr:'🎭 Classiques', en:'🎭 Classical' }
  };
  document.querySelectorAll('.filter-btn').forEach(b => { b.textContent = labels[b.dataset.cat][lang]; });
}

function setFilter(cat) {
  filter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  render();
}

function onSearch(val) {
  query = val;
  document.getElementById('search-clear').style.display = val ? 'block' : 'none';
  render();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  onSearch('');
}

function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function getFiltered() {
  let list = SALLES;
  if (filter !== 'all') list = list.filter(s => s.cat === parseInt(filter));
  if (query.trim()) {
    const q = norm(query.trim());
    list = list.filter(s => norm(s[lang].nom).includes(q) || norm(s.arr).includes(q) || norm(s[lang].type).includes(q));
  }
  return list;
}

function capaStr(n) {
  return n.toLocaleString('fr-FR') + ' pl.';
}

function render() {
  const filtered = getFiltered();
  const listEl = document.getElementById('salle-list');
  const empty  = document.getElementById('empty-state');
  const count  = document.getElementById('count-bar');

  if (!filtered.length) {
    listEl.innerHTML = '';
    empty.classList.add('visible');
    empty.textContent = lang === 'fr' ? 'Aucune salle trouvée' : 'No venue found';
    count.textContent = '';
    return;
  }
  empty.classList.remove('visible');
  count.textContent = lang === 'fr'
    ? `${filtered.length} salle${filtered.length > 1 ? 's' : ''}`
    : `${filtered.length} venue${filtered.length > 1 ? 's' : ''}`;

  const grouped = {};
  filtered.forEach(s => { (grouped[s.cat] = grouped[s.cat] || []).push(s); });

  let html = '';
  [1,2,3,4].forEach(cat => {
    if (!grouped[cat]) return;
    const c = CATS[cat];
    html += `<div class="cat-section">
      <div class="cat-title" style="color:${c.color}">
        <span class="dot" style="background:${c.color}"></span>${c[lang]}
      </div>`;
    grouped[cat].forEach(s => {
      const iconStyle = thumbCache[s.id]
        ? `background-image:url('${thumbCache[s.id]}');background-color:${CATS[s.cat].color}22`
        : `background:${CATS[s.cat].color}22`;
      const iconClass = thumbCache[s.id] ? 'salle-icon has-photo' : 'salle-icon';
      html += `<div class="salle-card" onclick="openModal(${s.id})">
        <div class="${iconClass}" id="icon-${s.id}" style="${iconStyle}">${s.icon}</div>
        <div class="salle-info">
          <div class="salle-name">${s[lang].nom}</div>
          <div class="salle-sub">${s[lang].type} · ${s.arr}</div>
        </div>
        <div class="salle-capa">~${capaStr(s.capa)}</div>
      </div>`;
    });
    html += '</div>';
  });
  listEl.innerHTML = html;
  // Chargement lazy des vignettes
  filtered.forEach(s => { if (s.wt && !thumbCache[s.id]) loadThumb(s); });
}

function openModal(id) {
  const s = SALLES.find(x => x.id === id);
  if (!s) return;
  activeSalle = id;
  const color = CATS[s.cat].color;

  document.getElementById('modal-icon').textContent = s.icon;
  document.getElementById('modal-icon').style.background = color + '22';
  document.getElementById('modal-name').textContent = s[lang].nom;
  document.getElementById('modal-arr').textContent  = s.arr;

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-row">
      <div class="modal-row-label">${lang==='fr'?'Capacité':'Capacity'}</div>
      <div class="modal-row-value"><span class="capa-badge" style="background:${color}">~${s.capa.toLocaleString('fr-FR')} places</span></div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">${lang==='fr'?'Catégorie':'Category'}</div>
      <div class="modal-row-value"><span class="cat-badge" style="background:${color}22;color:${color}">${CATS[s.cat][lang]}</span></div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">${lang==='fr'?'Type':'Type'}</div>
      <div class="modal-row-value">${s[lang].type}</div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">${lang==='fr'?'Adresse':'Address'}</div>
      <div class="modal-row-value">${s.adresse}</div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">${lang==='fr'?'À propos':'About'}</div>
      <div class="modal-row-value">${s[lang].desc}</div>
    </div>`;

  const btnSite = document.getElementById('modal-btn-site');
  btnSite.href = s.site;
  btnSite.textContent = lang === 'fr' ? '🌐 Site officiel' : '🌐 Official website';
  btnSite.style.background = color;

  const btnPlans = document.getElementById('modal-btn-plans');
  btnPlans.href = s.plans;
  btnPlans.textContent = lang === 'fr' ? '🎟️ Billetterie' : '🎟️ Book tickets';

  document.getElementById('modal-overlay').classList.add('open');
  loadPhoto(s);
}

function closeModalHandle() {
  document.getElementById('modal-overlay').classList.remove('open');
  activeSalle = null;
}

function maybeCloseModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
    activeSalle = null;
  }
}

function openAppsModal() {
  const appsById = {};
  NOS_APPS.forEach(a => { appsById[a.id] = a; });

  let html = '';
  APP_CATS.forEach(cat => {
    html += `<div class="apps-cat-title">${cat[lang]}</div>`;
    cat.ids.forEach(id => {
      const a = appsById[id];
      if (!a) return;
      html += `<div class="app-row" onclick="openAppUrl('${a.url}')">
        <div class="app-row-icon" id="appicon-${a.id}" style="background:${a.bg}">
          <img id="appimg-${a.id}" src="" style="display:none"/>
        </div>
        <div class="app-row-info">
          <div class="app-row-name">${a[lang][0]}</div>
          <div class="app-row-desc">${a[lang][1]}</div>
        </div>
        <div class="app-row-badge">
          <div class="app-store-badge">
            <div class="badge-sub">Available on the</div>
            <div class="badge-main">App Store</div>
          </div>
        </div>
      </div>`;
    });
  });

  document.getElementById('apps-list').innerHTML = html;
  document.getElementById('modal-apps-overlay').classList.add('open');

  // Chargement JSONP des icônes App Store
  NOS_APPS.forEach(a => {
    const cbName = 'itcb' + a.id;
    window[cbName] = function(d) {
      if (d.results && d.results[0]) {
        const imgEl = document.getElementById('appimg-' + a.id);
        if (imgEl) { imgEl.src = d.results[0].artworkUrl60; imgEl.style.display = 'block'; }
      }
    };
    const s = document.createElement('script');
    s.src = 'https://itunes.apple.com/lookup?id=' + a.id + '&callback=' + cbName;
    document.body.appendChild(s);
  });
}

function openAppUrl(url) {
  window.open(url, '_blank');
}

function maybeCloseApps(e) {
  if (e.target === document.getElementById('modal-apps-overlay'))
    document.getElementById('modal-apps-overlay').classList.remove('open');
}
